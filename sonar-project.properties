# SonarQube / SonarScanner — репозиторий users-go (Go).
# Положи этот файл в КОРЕНЬ репозитория рядом с go.mod.
#
# Локальный SonarQube (Jenkins: host.docker.internal):
# 1) В SonarQube должен существовать проект с тем же sonar.projectKey (см. Project information).
# 2) Токен в Jenkins (sonarqube-token) — с ЭТОГО SonarQube; пользователю нужны права на анализ / создание проекта.
# 3) Без коммита: в job «Build with Parameters» задайте SONAR_EXTRA_OPTS=-Dsonar.projectKey=ВАШ_КЛЮЧ_ИЗ_UI
# Ключ alexsanderknyazev-ops_users-go_* — обычно SonarCloud; на локальном сервере заведите проект с нужным ключом.

sonar.projectKey=users-go
sonar.projectName=users-go

# Корень исходников (от корня репозитория)
sonar.sources=.

# Кодировка
sonar.sourceEncoding=UTF-8

# --- Исключения анализа (как в k8s-manager, пути под users-go) ---
sonar.exclusions=**/vendor/**,\
  **/.git/**,\
  **/.github/**,\
  **/.idea/**,\
  **/testdata/**,\
  **/node_modules/**,\
  **/coverage.out,\
  **/*.out,\
  **/go.sum,\
  **/Dockerfile,\
  **/.dockerignore,\
  **/.env,\
  **/proto/**/*.pb.go,\
  **/proto/**/*_grpc.pb.go,\
  main.go

# Исключения из расчёта покрытия
sonar.coverage.exclusions=**/vendor/**,\
  **/proto/**/*.pb.go,\
  **/proto/**/*_grpc.pb.go,\
  main.go

# Тесты Go
sonar.tests=.
sonar.test.inclusions=**/*_test.go

# Отчёт покрытия (генерируется в CI: go test ./... -coverprofile=coverage.out)
sonar.go.coverage.reportPaths=coverage.out
