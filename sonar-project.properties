# SonarQube / SonarScanner — репозиторий users-go (Go).
# Положи этот файл в КОРЕНЬ репозитория рядом с go.mod.
#
# В SonarCloud/SonarQube ключ проекта должен совпадать с sonar.projectKey в UI проекта.

sonar.projectKey=alexsanderknyazev-ops_users-go_3d181dab-126c-45eb-99aa-6c19b833c568
sonar.projectName=users-go

# Обязательно для SonarCloud (ключ организации в UI). Для on-prem SonarQube строку можно удалить.
sonar.organization=alexsanderknyazev-ops

# Корень исходников (от корня репозитория)
sonar.sources=.

# Кодировка
sonar.sourceEncoding=UTF-8

# --- Исключения анализа (issues, дубли, метрики по этим путям не считаются) ---
# Точка входа (тонкая обвязка), сгенерированный protobuf, vendor и артефакты.
sonar.exclusions=**/proto/*.pb.go,**/proto/*_grpc.pb.go,**/vendor/**,main.go

# Исключения из расчёта покрытия
sonar.coverage.exclusions=**/proto/*.pb.go,**/proto/*_grpc.pb.go,main.go

# Тесты Go
sonar.tests=.
sonar.test.inclusions=**/*_test.go

# Отчёт покрытия (генерируется в CI: go test ./... -coverprofile=coverage.out)
sonar.go.coverage.reportPaths=coverage.out
