# SonarQube / SonarScanner — репозиторий users-go (Go).
# Положи этот файл в КОРЕНЬ репозитория рядом с go.mod.
#
# Локальный SonarQube (Jenkins: host.docker.internal): создайте проект с ключом users-go
# или замените sonar.projectKey на точный Project key из UI (Project information).
# Ключ вида alexsanderknyazev-ops_users-go_* — для SonarCloud; на локальном сервере проекта с ним нет, если вы его не создавали.

sonar.projectKey=users-go
sonar.projectName=users-go

# Корень исходников (от корня репозитория)
sonar.sources=.

# Кодировка
sonar.sourceEncoding=UTF-8

# --- Исключения анализа (как в k8s-manager, пути под users-go) ---
sonar.exclusions=**/vendor/**,\
  **/.git/**,\
  **/.github/**,\
  **/.idea/**,\
  **/testdata/**,\
  **/node_modules/**,\
  **/coverage.out,\
  **/*.out,\
  **/go.sum,\
  **/Dockerfile,\
  **/.dockerignore,\
  **/.env,\
  **/proto/**/*.pb.go,\
  **/proto/**/*_grpc.pb.go,\
  main.go

# Исключения из расчёта покрытия
sonar.coverage.exclusions=**/vendor/**,\
  **/proto/**/*.pb.go,\
  **/proto/**/*_grpc.pb.go,\
  main.go

# Тесты Go
sonar.tests=.
sonar.test.inclusions=**/*_test.go

# Отчёт покрытия (генерируется в CI: go test ./... -coverprofile=coverage.out)
sonar.go.coverage.reportPaths=coverage.out
