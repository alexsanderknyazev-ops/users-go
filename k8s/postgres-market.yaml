# =============================================================================
# PostgreSQL в namespace market (лабораторный стенд)
# =============================================================================
# Назначение: один Postgres для user-service по DNS-имени «postgres», порт 5432.
# Учётные данные согласованы с env в user-service-registry.yaml:
#   пользователь admin, БД marketdb, пароль в Secret postgres-secret.
#
# Применение: kubectl apply -f k8s/postgres-market.yaml
# Внимание: пароль в открытом виде в git — только для локальной разработки.
# =============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: market
---
# Secret: пароль суперпользователя Postgres (POSTGRES_PASSWORD).
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: market
stringData:
  POSTGRES_PASSWORD: admin123
---
# Deployment: образ postgres:16-alpine, одна реплика.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: market
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "admin"
            - name: POSTGRES_DB
              value: "marketdb"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
# Service: имя «postgres» — то же хостname, что ожидает приложение (DB_HOST=postgres).
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: market
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
  type: ClusterIP
