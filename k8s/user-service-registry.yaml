# Образ со статичным тегом для Sonar/IaC; в CI строка image: заменяется на K8S_PULL_REGISTRY/DOCKER_IMAGE:BUILD_NUMBER.
#
# Локальный деплой (K8S_CTR_IMPORT_IMAGE): Jenkins делает docker save | docker load внутри ноды minikube
# (kubelet через cri-dockerd смотрит dockerd, не ctr k8s.io). imagePullPolicy Never.
# Без импорта: образ из registry — нужен insecure-registry для HTTP.
apiVersion: v1
kind: Namespace
metadata:
  name: market
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: market
  labels:
    app: user-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      automountServiceAccountToken: false
      containers:
        - name: user-service
          image: host.minikube.internal:5050/users-go:1.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8072
          env:
            - name: APP_PORT
              value: "8072"
            - name: DB_HOST
              value: "postgres"
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              value: "admin"
            - name: DB_PASSWORD
              value: "admin123"
            - name: DB_NAME
              value: "marketdb"
          readinessProbe:
            httpGet:
              path: /users/health
              port: 8072
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /users/health
              port: 8072
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
              ephemeral-storage: "256Mi"
            limits:
              memory: "256Mi"
              cpu: "200m"
              ephemeral-storage: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: market
spec:
  selector:
    app: user-service
  ports:
    - name: http
      port: 8072
      targetPort: 8072
  type: ClusterIP
