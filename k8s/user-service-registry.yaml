# =============================================================================
# user-service в Kubernetes (namespace market)
# =============================================================================
# Назначение: Deployment + Service для Go-сервиса users-go (порт 8072, health /users/health).
#
# Подстановки из Jenkins (stage «Deploy to Minikube»):
#   • image: — на образ билда (registry или users-go:jenkins-N при docker load).
#   • __K8S_DB_HOST__ / __K8S_DB_PORT__ — хост и порт Postgres (параметры K8S_DB_*).
#   • imagePullPolicy: Always → Never, если образ грузится локально в minikube (docker load).
#
# Статический image:…:1.0.0 и Always — для Sonar/IaC; в CI перезаписываются.
# Sonar: каталог k8s/ исключён в sonar-project.properties (лаб-манифесты).
# =============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: market
---
# --- Deployment: один под user-service, лейбл app=user-service (селектор Service) ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: market
  labels:
    app: user-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      # Не монтировать токен default ServiceAccount (требования Sonar / политика).
      automountServiceAccountToken: false
      containers:
        - name: user-service
          # Плейсхолдер для сканеров; Jenkins подставляет реальный образ.
          image: host.minikube.internal:5050/users-go:1.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8072
          env:
            - name: APP_PORT
              value: "8072"
            # DB: значения __…__ заменяет Jenkins (дефолт postgres:5432 при in-cluster Postgres).
            - name: DB_HOST
              value: "__K8S_DB_HOST__"
            - name: DB_PORT
              value: "__K8S_DB_PORT__"
            - name: DB_USER
              value: "admin"
            - name: DB_PASSWORD
              value: "admin123"
            - name: DB_NAME
              value: "marketdb"
          readinessProbe:
            httpGet:
              path: /users/health
              port: 8072
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /users/health
              port: 8072
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
              ephemeral-storage: "256Mi"
            limits:
              memory: "256Mi"
              cpu: "200m"
              ephemeral-storage: "512Mi"
---
# --- Service: внутрикластерный доступ к подам с app=user-service на порту 8072 ---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: market
spec:
  selector:
    app: user-service
  ports:
    - name: http
      port: 8072
      targetPort: 8072
  type: ClusterIP
